services:
  - type: web
    name: cloud-book-23itb010
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HO_VA_TEN
        value: "Vo Ngoc Bao"
      - key: MA_SV
        value: "23ITB010"
      - key: DB_NAME
        value: "DB_23ITB010"
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGO_READ_URI
        sync: false
      - key: MONGO_WRITE_URI
        sync: false
